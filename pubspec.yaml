name: testable
description: "Flutter Blueprint is a production-grade Flutter foundation designed to accelerate real-world app development. It provides a clean, scalable architecture with Riverpod integration, environment configuration, networking, authentication flows, error handling, logging, notifications, and complete testing scaffolding. Built to serve as a long-term base for enterprise and consumer applications, Flutter Blueprint focuses on maintainability, performance, and best practices—so teams can ship faster without compromising structure."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  go_router: ^17.0.1
  awesome_extensions: ^2.0.24
  cached_network_image: ^3.4.1
  connectivity_plus: ^7.0.0
  dev: ^1.0.0
  dio: ^5.7.0
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.0
  flutter_lints: ^6.0.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.0.16
  freezed_annotation: ^3.1.0
  iconsax: ^0.0.8
  json_annotation: ^4.9.0
  logger: ^2.5.0
  logging: ^1.3.0
  lottie: ^3.3.0
  permission_handler: ^12.0.1
  retrofit: ^4.4.1
  shared_preferences: ^2.3.5
  shimmer: ^3.0.0
  toastification: ^3.0.3
  fl_chart: ^1.1.1
  graphview: ^1.2.0
  google_fonts: ^8.0.0
  auto_route: ^11.1.0
  rxdart: ^0.28.0
  intl: ^0.20.2

dependency_overrides:
  # vector_math: 2.1.4

dev_dependencies:
  build_runner: ^2.4.13
  custom_lint:
  auto_route_generator: ^10.4.0
  riverpod_generator: ^4.0.0+1
  riverpod_lint: ^3.1.0
  coverage: ^1.9.2
  flutter_gen_runner: ^5.8.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.3
  integration_test:
    sdk: flutter
  json_serializable: ^6.9.0
  mockito: ^5.4.5
  retrofit_generator: ^10.2.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env
    - .env.test
    - assets/svgs/
  #   - images/a_dot_ham.jpeg

# Watch mode (what you're trying to run)
# fvm flutter pub run build_runner watch

# Clean build (if you have issues)
# fvm flutter pub run build_runner watch --delete-conflicting-outputs